# =============================================================================
# Kumquat - PostgreSQL Configuration
# =============================================================================
#
# This file overrides PostgreSQL's default settings, which are designed for
# machines with very limited resources (64MB RAM). These values are tuned for
# a container with 512MB-2GB of RAM running on SSD storage.
#
# Only parameters that differ from the defaults are listed here. PostgreSQL
# uses its built-in defaults for everything else.
#
# To verify that these settings are active, run:
#   docker exec <container> psql -U kumquat -c "SHOW shared_buffers;"
#
# Reference: https://www.postgresql.org/docs/17/runtime-config.html
# =============================================================================


# -----------------------------------------------------------------------------
# CONNECTIONS
# -----------------------------------------------------------------------------

# Maximum number of simultaneous connections.
# Default: 100. Each idle connection consumes ~5-10MB of RAM.
# Our backend uses a pgx pool with MaxConns=20, so 30 gives comfortable
# headroom for admin connections (psql, monitoring, migrations).
# Reducing from 100 to 30 frees ~350-700MB of potential memory overhead.
max_connections = 30

# Accept connections from any IP (required inside Docker container).
listen_addresses = '*'


# -----------------------------------------------------------------------------
# MEMORY
# -----------------------------------------------------------------------------

# Size of the shared memory buffer pool. This is PostgreSQL's main cache:
# when a query reads a row, it first checks shared_buffers before going to disk.
# Rule of thumb: ~25% of total container RAM.
# Default: 128MB (happens to be correct for 512MB container, but we set it
# explicitly so it's intentional rather than coincidental).
shared_buffers = 128MB

# Memory allocated PER SORT/HASH OPERATION within a single query.
# A complex query with multiple ORDER BY / GROUP BY / DISTINCT / hash joins
# can allocate work_mem multiple times. If the operation exceeds this limit,
# PostgreSQL spills to temporary files on disk (much slower).
# Default: 4MB. We increase to 8MB for JSONB operations on tree_data/results
# columns which can involve non-trivial sorting.
# Caution: total memory usage = work_mem x number_of_concurrent_operations.
# With max_connections=30 and ~2 operations per query: worst case ~480MB.
work_mem = 8MB

# Memory for maintenance operations: VACUUM, CREATE INDEX, ALTER TABLE.
# These run infrequently but benefit from more memory to complete faster.
# Default: 64MB (adequate for our schema size, kept as-is for clarity).
maintenance_work_mem = 64MB

# Hint to the query planner about the total memory available for caching
# (shared_buffers + OS filesystem cache). This is NOT an allocation.
# The planner uses it to estimate whether data is likely cached in memory,
# which influences its choice between index scans and sequential scans.
# Rule of thumb: ~75% of total container RAM.
# Default: 4GB (wildly wrong for a 512MB container).
effective_cache_size = 384MB


# -----------------------------------------------------------------------------
# QUERY PLANNER
# -----------------------------------------------------------------------------

# Estimated cost of a random (non-sequential) page read, relative to a
# sequential read (always 1.0). The planner uses this to decide between:
#   - Index scan (random reads, cost = random_page_cost per page)
#   - Sequential scan (linear reads, cost = 1.0 per page)
# Default: 4.0 (designed for spinning HDDs where random I/O is ~4x slower).
# On SSDs, random reads are nearly as fast as sequential reads.
# Setting to 1.1 tells the planner to strongly prefer using indexes.
random_page_cost = 1.1

# Number of concurrent I/O requests the OS can handle efficiently.
# Default: 1 (assumes spinning disk). SSDs can handle many parallel requests.
# This helps bitmap heap scans and prefetching.
effective_io_concurrency = 200


# -----------------------------------------------------------------------------
# WAL (Write-Ahead Log) - Write Performance
# -----------------------------------------------------------------------------

# Buffer size for WAL data before it's written to disk.
# Default: -1 (auto = ~3% of shared_buffers = ~4MB). We set it explicitly.
# Larger buffers reduce the number of disk writes during write-heavy operations
# (e.g., importing a batch of game analyses).
wal_buffers = 4MB

# How aggressively PostgreSQL spreads checkpoint writes over time.
# Default: 0.9 (spread writes over 90% of the checkpoint interval).
# Higher values = smoother I/O at the cost of slightly longer recovery time.
# 0.9 is already optimal; we set it explicitly for documentation.
checkpoint_completion_target = 0.9

# Maximum WAL size before a checkpoint is forced.
# Default: 1GB. We reduce to 256MB because our write volume is low and this
# limits WAL disk usage. If you see frequent checkpoint warnings in logs,
# increase this value.
max_wal_size = 256MB


# -----------------------------------------------------------------------------
# LOGGING - Slow Query Detection
# -----------------------------------------------------------------------------

# Log any query that takes longer than this many milliseconds.
# Default: -1 (disabled). This is the single most useful diagnostic setting.
# Set to 200ms to catch slow JSONB operations on tree_data/results columns.
# Logged queries appear in: docker-compose logs postgres
log_min_duration_statement = 200

# Which SQL statements to log regardless of duration.
# 'none' = only log slow queries (via log_min_duration_statement above).
# Options: none, ddl, mod, all
log_statement = 'none'

# Prefix format for each log line. Includes:
#   %t = timestamp, %p = process ID, %u = username, %d = database name
log_line_prefix = '%t [%p] %u@%d '


# -----------------------------------------------------------------------------
# AUTOVACUUM - Dead Row Cleanup
# -----------------------------------------------------------------------------
# PostgreSQL uses MVCC: UPDATE and DELETE don't remove old rows immediately,
# they mark them as "dead". Autovacuum reclaims this space periodically.
# Without it, tables bloat over time and queries slow down.

# How often the autovacuum launcher checks for tables needing cleanup.
# Default: 60s (1 minute). We reduce to 30s for faster cleanup on tables
# with frequent updates (e.g., repertoires.tree_data, engine_evals.status).
autovacuum_naptime = 30
