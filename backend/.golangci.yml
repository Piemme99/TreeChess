version: "2"

linters:
  default: none
  enable:
    - errcheck      # Check unchecked errors
    - govet         # Reports suspicious constructs
    - ineffassign   # Detects unused variable assignments
    - staticcheck   # Advanced static analysis
    - unused        # Finds unused code
    - gosimple      # Suggests code simplifications
    - gocritic      # Opinionated linter with useful checks
    - revive        # Fast, configurable linter (golint replacement)
    - misspell      # Finds commonly misspelled English words
    - unconvert     # Removes unnecessary type conversions
    - nilerr        # Detects returning nil after checking error

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true  # Don't require comments on all exports

issues:
  exclude-dirs:
    - tests/integration  # Integration tests have different patterns
