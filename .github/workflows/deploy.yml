name: Deploy

# Appelé par la CI à chaque push vert sur main. À la main : redéployer, ou revenir à un commit
# précédent dont la CI a publié les images.
on:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit to deploy (empty = head of main). To roll back, an earlier commit of main."
        type: string
        required: false

permissions:
  contents: read
  packages: write

env:
  PUBLIC_URL: https://kumquatchess.com

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # Deux push rapprochés : la CI du premier peut finir après celle du second. Un déploiement
      # automatique qui n'est plus la tête de main s'efface, sinon il remettrait du code plus ancien.
      - name: Resolve commit and images
        id: target
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          commit="$(git rev-parse --verify --quiet "${INPUT_COMMIT:-$GITHUB_SHA}^{commit}")" || {
            echo "::error::Unknown commit: ${INPUT_COMMIT}"
            exit 1
          }
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            head="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [ "$commit" != "$head" ]; then
              echo "::notice::main has moved to ${head::7}: skipping ${commit::7}, the newer run deploys"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "commit=$commit"
            echo "tag=sha-${commit::7}"
            echo "backend_image=ghcr.io/${owner}/kumquat-backend"
            echo "frontend_image=ghcr.io/${owner}/kumquat-frontend"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.target.outputs.skip != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that the images exist
        if: steps.target.outputs.skip != 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          BACKEND_IMAGE: ${{ steps.target.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.target.outputs.frontend_image }}
        run: |
          for image in "$BACKEND_IMAGE:$TAG" "$FRONTEND_IMAGE:$TAG"; do
            docker buildx imagetools inspect "$image" > /dev/null || {
              echo "::error::$image not found: the CI on main publishes the images of each commit"
              exit 1
            }
          done

      - name: Deploy via SSH
        if: steps.target.outputs.skip != 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          COMMIT: ${{ steps.target.outputs.commit }}
          IMAGE_TAG: ${{ steps.target.outputs.tag }}
          BACKEND_IMAGE: ${{ steps.target.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.target.outputs.frontend_image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: COMMIT,IMAGE_TAG,BACKEND_IMAGE,FRONTEND_IMAGE,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            set -e

            cd ${{ secrets.DEPLOY_PATH }}

            # Pre-flight: validate .env.production against the production config
            # guards in backend/config (config.MustLoad panics at startup on these).
            # Catch a bad config HERE and abort before swapping containers, so a
            # violation fails the pipeline instead of crash-looping the live backend
            # (which would also keep the frontend down via depends_on healthcheck).
            if [ ! -f .env.production ]; then
              echo "::error::.env.production not found in $(pwd)"
              exit 1
            fi
            get_env() { grep -E "^$1=" .env.production 2>/dev/null | head -n1 | cut -d= -f2- || true; }
            preflight_fail=0
            if [ "$(printf %s "$(get_env JWT_SECRET)" | wc -c)" -lt 32 ]; then
              echo "::error::JWT_SECRET must be at least 32 bytes in production"
              preflight_fail=1
            fi
            # SECURE_COOKIES defaults to 'true' via the compose ${VAR:-true}; only an
            # explicit non-'true' value trips the guard.
            secure_cookies="$(get_env SECURE_COOKIES)"
            if [ -n "$secure_cookies" ] && [ "$secure_cookies" != "true" ]; then
              echo "::error::SECURE_COOKIES must be 'true' (or unset) in production"
              preflight_fail=1
            fi
            case "$(get_env CORS_ALLOWED_ORIGINS)" in
              *"*"*) echo "::error::CORS_ALLOWED_ORIGINS must not contain '*'"; preflight_fail=1 ;;
            esac
            if [ "$preflight_fail" -ne 0 ]; then
              echo "Aborting deploy: .env.production violates the production config guards."
              exit 1
            fi
            echo "Pre-flight config validation passed."

            # Une seule fois : un export complet de la base, gardé hors rotation, avant que le nouveau backend
            # ne supprime au démarrage les colonnes et la table de la connexion par e-mail. Sans export lisible,
            # le déploiement s'arrête.
            if [ ! -s backups/legacy-auth-final.sql.gz ]; then
              mkdir -p backups
              pg_user="$(get_env POSTGRES_USER)"
              set -o pipefail
              if ! docker compose --env-file .env.production -f docker-compose.prod.ghcr.yml exec -T postgres \
                  pg_dump -U "${pg_user:-treechess}" -d treechess | gzip > backups/legacy-auth-final.sql.gz \
                  || ! gzip -t backups/legacy-auth-final.sql.gz \
                  || [ "$(gzip -dc backups/legacy-auth-final.sql.gz | head -c 64 | wc -c)" -lt 64 ]; then
                rm -f backups/legacy-auth-final.sql.gz
                echo "::error::Database export failed: deploy aborted before the legacy columns are dropped"
                exit 1
              fi
              set +o pipefail
              echo "Database export: $(du -h backups/legacy-auth-final.sql.gz | cut -f1) in backups/legacy-auth-final.sql.gz"
            fi

            # Les images d'abord : si le tirage échoue, la config du serveur n'a pas encore bougé.
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            docker pull --quiet "$BACKEND_IMAGE:$IMAGE_TAG"
            docker pull --quiet "$FRONTEND_IMAGE:$IMAGE_TAG"
            docker logout ghcr.io

            # Le commit exact des images, pas la tête de main : la config nginx et le compose
            # doivent aller avec elles, y compris pour un retour arrière.
            git fetch --quiet origin
            git checkout --quiet --detach "$COMMIT"

            export IMAGE_TAG
            docker compose --env-file .env.production -f docker-compose.prod.ghcr.yml up -d

            # Les images taguées sha-… ne sont jamais « dangling » : sans ce tri, elles s'empilent.
            docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep -E "^($BACKEND_IMAGE|$FRONTEND_IMAGE):" \
              | grep -v ":$IMAGE_TAG\$" \
              | xargs -r docker rmi > /dev/null 2>&1 || true
            docker image prune -f > /dev/null

            echo "Deployed $IMAGE_TAG ($COMMIT)"

      - name: Check the live site
        if: steps.target.outputs.skip != 'true'
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors --max-time 10 "$PUBLIC_URL/api/health"
          echo
          curl -fsS --max-time 10 -o /dev/null "$PUBLIC_URL/v2/home"

      - name: Move the latest tag
        if: steps.target.outputs.skip != 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          BACKEND_IMAGE: ${{ steps.target.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.target.outputs.frontend_image }}
        run: |
          docker buildx imagetools create --tag "$BACKEND_IMAGE:latest" "$BACKEND_IMAGE:$TAG"
          docker buildx imagetools create --tag "$FRONTEND_IMAGE:latest" "$FRONTEND_IMAGE:$TAG"
