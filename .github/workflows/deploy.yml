name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: production
        type: choice
        options:
          - production

# Only one deployment at a time
concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # Run the CI checks first to make sure everything is green
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Set image tag and registry
        id: meta
        run: |
          TAG="sha-$(git rev-parse --short HEAD)"
          OWNER_LC="${{ env.OWNER }}"
          OWNER_LC="${OWNER_LC,,}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${OWNER_LC}/kumquat-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${OWNER_LC}/kumquat-frontend" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG (owner: $OWNER_LC)"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: prod
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.backend_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: prod
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.frontend_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e

            cd ${{ secrets.DEPLOY_PATH }}

            # Pre-flight: validate .env.production against the production config
            # guards in backend/config (config.MustLoad panics at startup on these).
            # Catch a bad config HERE and abort before swapping containers, so a
            # violation fails the pipeline instead of crash-looping the live backend
            # (which would also keep the frontend down via depends_on healthcheck).
            if [ ! -f .env.production ]; then
              echo "::error::.env.production not found in $(pwd)"
              exit 1
            fi
            get_env() { grep -E "^$1=" .env.production 2>/dev/null | head -n1 | cut -d= -f2- || true; }
            preflight_fail=0
            if [ "$(printf %s "$(get_env JWT_SECRET)" | wc -c)" -lt 32 ]; then
              echo "::error::JWT_SECRET must be at least 32 bytes in production"
              preflight_fail=1
            fi
            # SECURE_COOKIES defaults to 'true' via the compose ${VAR:-true}; only an
            # explicit non-'true' value trips the guard.
            secure_cookies="$(get_env SECURE_COOKIES)"
            if [ -n "$secure_cookies" ] && [ "$secure_cookies" != "true" ]; then
              echo "::error::SECURE_COOKIES must be 'true' (or unset) in production"
              preflight_fail=1
            fi
            case "$(get_env CORS_ALLOWED_ORIGINS)" in
              *"*"*) echo "::error::CORS_ALLOWED_ORIGINS must not contain '*'"; preflight_fail=1 ;;
            esac
            if [ "$preflight_fail" -ne 0 ]; then
              echo "Aborting deploy: .env.production violates the production config guards."
              exit 1
            fi
            echo "Pre-flight config validation passed."

            # Pull latest code (for docker-compose, nginx configs, migrations, etc.)
            git pull origin main

            # Log in to GHCR and pull new images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Export the image tag for docker compose
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"

            # Pull new images and restart with the GHCR compose file
            docker compose --env-file .env.production -f docker-compose.prod.ghcr.yml pull backend frontend
            docker compose --env-file .env.production -f docker-compose.prod.ghcr.yml up -d

            # Clean up old images
            docker image prune -f

            echo "Deployed successfully with tag: $IMAGE_TAG"
