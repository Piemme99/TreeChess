version: 2

updates:
  # Go modules
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(go):"
    labels:
      - dependencies
      - go
    open-pull-requests-limit: 5

  # npm packages
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(npm):"
    labels:
      - dependencies
      - npm
    open-pull-requests-limit: 5
    groups:
      typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(actions):"
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 3

  # Images de base des Dockerfiles (node, golang, debian, nginx)
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(docker):"
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 3

  # Images des compose (postgres, prometheus, grafana, certbot)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(docker):"
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 3
    ignore:
      # Un saut de version majeure de Postgres exige un pg_upgrade du volume : jamais en PR automatique.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
