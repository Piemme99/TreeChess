# =============================================================================
# Kumquat Production Nginx Configuration
# Handles TLS termination, HTTP->HTTPS redirect, and reverse proxy to backend
# =============================================================================

# --- DDoS protection: rate limiting and connection limits ---
# 10 requests/second per IP for API (burst absorbs short spikes)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# Stricter limit for auth endpoints: 5 requests/minute per IP
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
# Max 20 simultaneous connections per IP
limit_conn_zone $binary_remote_addr zone=addr:10m;

# HTTP — redirect all traffic to HTTPS + serve ACME challenges for certbot
server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Let's Encrypt ACME challenge (certbot writes here)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check available on HTTP (for Docker healthcheck)
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Everything else → redirect to HTTPS (always bare domain, not www)
    location / {
        return 301 https://kumquatchess.com$request_uri;
    }
}

# HTTPS — redirect www to bare domain
server {
    listen 8443 ssl;
    http2 on;
    server_name www.kumquatchess.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/kumquat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kumquat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://kumquatchess.com$request_uri;
}

# HTTPS — main server
server {
    listen 8443 ssl;
    http2 on;
    server_name kumquatchess.com;
    server_tokens off;

    # --- TLS certificates (managed by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/kumquat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kumquat/privkey.pem;

    # --- TLS hardening ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    # --- HSTS (force browsers to always use HTTPS) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    # text/html is always compressed by nginx, no need to list it
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/wasm;

    # --- COEP/COOP headers for SharedArrayBuffer (Stockfish WASM) ---
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # --- Health check ---
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # --- API reverse proxy ---
    location /api/ {
        # DDoS protection at the nginx layer (before requests reach Go)
        limit_req zone=api burst=20 nodelay;
        limit_conn addr 20;

        # Match backend body limit for PGN uploads
        client_max_body_size 10m;

        # Proxy timeouts (generous for imports/sync with external APIs)
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    120s;

        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Auth endpoints — stricter rate limiting ---
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_conn addr 10;

        client_max_body_size 16k;

        proxy_connect_timeout 10s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        proxy_pass http://backend:8080/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # --- Vite hashed assets — immutable cache ---
    location /assets/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # --- WASM files — immutable cache ---
    location ~* \.wasm$ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # --- Favicons and web manifest — cache for 1 week ---
    location ~* ^/(favicon\.ico|favicon-.*\.png|apple-touch-icon\.png|android-chrome-.*\.png|site\.webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
